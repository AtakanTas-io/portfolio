<body>

    <header>
        <nav class="navbar">
            <div class="logo">&lt;AtakanTaş /&gt;</div>

                <span class="bar"></span>
                <span class="bar"></span>

            <ul class="nav-links" id="nav-links">

            </ul>
        </nav>
    </header>

    <main>
        <section class="contact-section">
            <h1>&lt;Bağlantı Kur /&gt;</h1>
            <p>Proje teklifleri veya sadece merhaba demek için terminali kullan:</p>

            <form id="contact-form">
                <div class="form-group">
                    <label for="name">Kullanıcı Adı (İsim):</label>
                    <input type="text" id="name" name="name" placeholder="Adınız..." required autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="email">E-Posta Protokolü:</label>
                    <input type="email" id="email" name="email" placeholder="ornek@email.com" required
                        autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="message">Veri Paketi (Mesaj):</label>
                    <textarea id="message" name="message" rows="5" placeholder="Mesajınızı buraya kodlayın..."
                        required></textarea>
                </div>

                <button type="submit" class="btn full-width">GÖNDER >_</button>
            </form>

            <div id="form-feedback"></div>
        </section>
    </main>

    <footer>
