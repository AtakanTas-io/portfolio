      // yüklenmeden önce kayıtlı temayı <html> etiketine uygular.
      (function () {
        try {
          if (localStorage.getItem("theme") === "light") {
            document.documentElement.classList.add("light-mode");
          }
        } catch (e) {}
      })();
    </script>

    />

  <body>
    <header>
      <nav class="navbar">
        <div class="logo">&lt;AtakanTaş /&gt;</div>

        </ul>
      </nav>

    <main>
      <section class="contact-section">
        <h1>&lt;Bağlantı Kur /&gt;</h1>
        <p style="margin-bottom: 20px">
          Proje teklifleri veya sadece merhaba demek için terminali kullan:
        </p>

        <form
          id="contact-form"
          name="iletisim"
          method="POST"
          data-netlify="true"
          netlify-honeypot="bot-field"
        >
          <input type="hidden" name="form-name" value="iletisim" />
          <p style="position: absolute; left: -9999px" aria-hidden="true">
            <label>Bu alanı boş bırakın: <input name="bot-field" tabindex="-1" autocomplete="off" /></label>
          </p>
          <div class="form-group">
            <label for="name">Kullanıcı Adı (İsim):</label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="Adınız..."
              required
              autocomplete="off"
            />
          </div>

          <div class="form-group">
            <label for="email">E-Posta Protokolü:</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="ornek@email.com"
              required
              autocomplete="off"
            />
          </div>

          <div class="form-group">
            <label for="message">Veri Paketi (Mesaj):</label>
            <textarea
              id="message"
              name="message"
              rows="5"
              placeholder="Mesajınızı buraya kodlayın..."
              required
            ></textarea>
          </div>

          <button type="submit" class="btn full-width">GÖNDER >_</button>
        </form>
        <div id="form-feedback"></div>
      </section>
    </main>
